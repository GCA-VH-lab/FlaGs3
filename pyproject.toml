[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flags3"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
	"biopython>=1.79",
	"requests>=2.25",
	"pyhmmer>=0.12,<0.13",
	"cairosvg>=2.7",
	"pybiolib>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
flags3 = "flags3.cli:main"

[tool.setuptools]
packages = ["flags3", "flags3.stages", "flags3.data", "flags3.render"]

[tool.setuptools.package-data]
"flags3.data" = ["*.tsv"]

[tool.setuptools.dynamic]
version = {attr = "flags3.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
